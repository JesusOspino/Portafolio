name: CI Build Check

on:
  # Valida que el sitio compila en cada push a `main`
  push:
    branches: [ main ]
  # Construye (sin publicar) en cada Pull Request como validación de CI
  pull_request:
    branches: [ main ]
  # Te permite ejecutar este flujo de trabajo manualmente desde la pestaña Acciones en GitHub.
  workflow_dispatch:

# El despliegue real lo hace AWS Amplify (ver amplify.yml), que se dispara
# automáticamente desde la consola de Amplify al detectar el push a `main`.
# Este workflow solo sirve como chequeo de CI (build) y no publica nada.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # La versión de pnpm se toma del campo "packageManager" de package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build
